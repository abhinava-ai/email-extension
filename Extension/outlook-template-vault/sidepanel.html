<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail Template Vault</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="app-shell">
    <section id="listView" class="view">
      <header class="topbar">
        <div><p class="eyebrow">OUTLOOK</p><h1>Template Vault</h1></div>
      </header>

      <label class="search-wrap" for="searchInput">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Search templates" autocomplete="off">
      </label>

      <div class="template-scroll">
        <div id="templateList" class="template-list" aria-live="polite"></div>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-icon">✉</div>
          <h2>No templates available</h2>
          <p>Add templates from the web dashboard. They will appear here automatically.</p>
        </div>
      </div>

      <div class="bottom-panel">
        <section id="accountCard" class="account-card" aria-labelledby="accountTitle">
          <div id="signedOutView">
            <div class="account-summary">
              <div><p class="eyebrow">ACCOUNT</p><h2 id="accountTitle">Use your vault anywhere</h2></div>
              <span class="plan-badge">Free</span>
            </div>
            <p class="account-copy">Sign in when you’re ready. Your local templates keep working either way.</p>
            <div class="account-actions">
              <button id="showSignInBtn" class="secondary compact" type="button">Sign in</button>
              <button id="showCreateAccountBtn" class="text-btn account-link" type="button">Create account</button>
            </div>
            <form id="authForm" class="auth-form" hidden>
              <p id="authFormTitle" class="auth-form-title">Sign in</p>
              <label id="authNameField" class="auth-field" hidden>Full name<input id="authName" name="name" maxlength="120" autocomplete="name"></label>
              <label class="auth-field">Email<input id="authEmail" name="email" type="email" autocomplete="email" required></label>
              <label class="auth-field">Password<input id="authPassword" name="password" type="password" minlength="8" autocomplete="current-password" required></label>
              <p id="authError" class="form-error" hidden></p>
              <div class="auth-form-actions"><button id="authSubmitBtn" class="primary compact" type="submit">Sign in</button><button id="cancelAuthBtn" class="text-btn" type="button">Cancel</button></div>
            </form>
          </div>
          <div id="signedInView" hidden>
            <div class="account-summary">
              <div class="account-identity"><span id="accountAvatar" class="account-avatar">A</span><div><strong id="accountName">Account</strong><span id="accountEmail"></span></div></div>
              <button id="signOutBtn" class="text-btn account-link sign-out-inline" type="button">Sign out</button>
            </div>
          </div>
        </section>
      </div>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>

  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="sanitizer.js"></script>
  <script src="storage.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
